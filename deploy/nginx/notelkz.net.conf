# /etc/nginx/sites-available/notelkz.net
# Static site from /var/www/notelkz.net, /api proxied to the core container.
# Get certificates first:  sudo certbot certonly --nginx -d notelkz.net -d www.notelkz.net

server {
    listen 80;
    listen [::]:80;
    server_name notelkz.net www.notelkz.net;
    return 301 https://notelkz.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.notelkz.net;
    ssl_certificate     /etc/letsencrypt/live/notelkz.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notelkz.net/privkey.pem;
    return 301 https://notelkz.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notelkz.net;

    ssl_certificate     /etc/letsencrypt/live/notelkz.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notelkz.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/notelkz.net;
    index index.html;
    charset utf-8;

    # Security headers live in a snippet because nginx drops inherited add_header
    # lines in any location that sets its own. Copy notelkz-security.conf to /etc/nginx/snippets/.
    include /etc/nginx/snippets/notelkz-security.conf;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except GET { deny all; }
    }

    # Hashed CSS/JS never change once published.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/notelkz-security.conf;
        try_files $uri =404;
    }
    location ~* \.(?:woff2?|webp|png|ico|jpg|jpeg|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/notelkz-security.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/notelkz-security.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
