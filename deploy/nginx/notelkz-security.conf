# /etc/nginx/snippets/notelkz-security.conf
# CSP: only our own files, plus Twitch thumbnails and the click-to-load Twitch player.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://static-cdn.jtvnw.net https://clips-media-assets2.twitch.tv; connect-src 'self'; frame-src https://player.twitch.tv; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
