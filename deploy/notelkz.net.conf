# /etc/nginx/sites-available/notelkz.net
# Serves /var/www/notelkz/web and passes /api to the core service on 127.0.0.1:8787.
# Run `certbot --nginx -d notelkz.net -d www.notelkz.net` after enabling; it adds HTTPS to this file.

server {
    listen 80;
    listen [::]:80;
    server_name notelkz.net www.notelkz.net;

    root /var/www/notelkz/web;
    index index.html;
    charset utf-8;

    # Security headers (everything is served from this domain; no inline scripts or styles).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://images.igdb.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        expires 10m;
    }

    # Your editable data: never cached, so changes show on the next page load.
    location /data/ {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:woff2?|png|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_except GET { deny all; }
    }

    # Unknown addresses go back to the homepage.
    error_page 404 = @home;
    location @home { return 302 /; }

    # Keep repo internals out of reach.
    location ~ /\. { deny all; }
}
