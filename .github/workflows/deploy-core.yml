# Tests the core service, then pulls and rebuilds it on the VPS.
# Uses the same secrets as deploy-site.yml. The repo must be cloned on the VPS at /opt/notelkz.
name: Deploy core service
on:
  push:
    branches: [main]
    paths: ['services/**', 'deploy/docker-compose.yml', '.github/workflows/deploy-core.yml']
  workflow_dispatch:

concurrency: { group: deploy-core, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: services/core
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the VPS
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/notelkz && git pull --ff-only && cd deploy && docker compose up -d --build'
