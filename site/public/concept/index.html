<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notelkz</title>
<meta name="description" content="elkz on Twitch: live status, next stream, schedule and setup.">
<style>
@font-face { font-family: 'Inter'; src: url('/fonts/inter.woff') format('woff'); font-weight: 400 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #0b0c0b; --ink: #ecefea; --muted: #9aa39b; --faint: #5d655e; --track: #1c221d;
  --green: #00ff64; --green-ink: #03140a; --twitch: #9146ff; --discord: #5865f2;
  --line: rgba(236, 239, 234, 0.1);
  --glow-a: rgba(0, 255, 100, 0.2); --glow-b: rgba(145, 70, 255, 0.2);
}
/* holiday swaps the mood, nothing else */
body[data-state='holiday'] { --glow-a: rgba(255, 176, 64, 0.2); --glow-b: rgba(0, 200, 180, 0.14); }
body[data-state='live'] { --glow-a: rgba(0, 255, 100, 0.3); --glow-b: rgba(145, 70, 255, 0.28); }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh; display: grid; place-items: center; padding: 24px;
  background: var(--bg);
  background-image: radial-gradient(circle at 85% 10%, var(--glow-a), transparent 55%), radial-gradient(circle at 5% 100%, var(--glow-b), transparent 50%);
  background-attachment: fixed;
  color: var(--ink); font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6;
  transition: background-color .6s;
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

main { width: 100%; max-width: 560px; display: grid; gap: 22px; }
.logo { justify-self: start; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.04em; text-decoration: none; }

.status { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
body[data-state='live'] .dot { background: var(--green); animation: ping 1.8s infinite; }
body[data-state='live'] .status { color: var(--green); }
body[data-state='holiday'] .dot { background: #ffb040; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(0,255,100,.6); } 100% { box-shadow: 0 0 0 10px rgba(0,255,100,0); } }

h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 3.8rem); line-height: 1.02; letter-spacing: -0.04em; font-weight: 850; }
p { margin: 0; color: var(--muted); font-size: 1.05rem; }
p strong { color: var(--ink); font-weight: 600; }

.count { display: flex; gap: 18px; }
.count div { display: grid; }
.count b { font-size: clamp(2.2rem, 7vw, 3rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.count span { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-top: 6px; }

.bar { height: 4px; width: 100%; max-width: 320px; background: var(--track); overflow: hidden; border-radius: 2px; }
.bar span { display: block; height: 100%; width: 35%; background: var(--green); animation: slide 1.6s ease-in-out infinite; border-radius: 2px; }
.bar[data-mode='progress'] span { animation: none; transition: width .6s; }
body[data-state='holiday'] .bar span { background: #ffb040; }
body[data-state='live'] .bar span { width: 100%; animation: breathe 2.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
@keyframes breathe { 50% { opacity: .45; } }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 2px; text-decoration: none; font-weight: 600; font-size: .95rem; transition: filter .2s, background .2s, border-color .2s; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { filter: brightness(1.1); }
.btn-twitch { background: var(--twitch); color: #fff; }
.btn-discord { background: var(--discord); color: #fff; }
.btn-ghost { border: 1px solid var(--line); color: var(--ink); padding: 9px 14px; font-size: .9rem; background: rgba(255,255,255,.02); }
.btn-ghost:hover { border-color: rgba(236,239,234,.28); background: rgba(255,255,255,.05); filter: none; }
.btn-ghost[style] { box-shadow: inset 3px 0 0 var(--accent); padding-left: 17px; }
.btn-ghost[style]:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.drawer { --accent: var(--green); border-top: 3px solid var(--accent); }
.drawer .h3 { color: var(--accent); }
.tag.on { background: var(--accent); border-color: var(--accent); }
.tabs button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #0b0c0b; }
.note { font-size: .88rem; color: var(--faint); }
.sep { height: 1px; background: var(--line); }
.socials { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .88rem; }
.socials a { color: var(--muted); text-decoration: none; } .socials a:hover { color: var(--ink); }
[hidden] { display: none !important; }

/* drawer for schedule, setup, game tracker, wall of fame */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 100vw); background: #101310; border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(101%); transition: transform .45s cubic-bezier(.19,1,.22,1); }
body.open .scrim { opacity: 1; pointer-events: auto; } body.open .drawer { transform: none; }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px; border-bottom: 1px solid var(--line); }
.drawer h2 { margin: 0; font-size: 1.3rem; letter-spacing: -0.02em; }
.x { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 2px; font-size: 1.2rem; line-height: 1; }
.drawer .body { overflow-y: auto; padding: 8px 24px 32px; }
.item { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.item span:first-child { color: var(--muted); } .item span:last-child { text-align: right; font-weight: 600; } .item span:only-child { text-align: left; }
.item b { display: block; font-weight: 600; color: var(--ink); } .item small { display: block; color: var(--faint); font-size: .85rem; }
.h3 { margin: 22px 0 4px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--green); font-weight: 700; }
.tag { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; align-self: center; }
.tag.on { color: #0b0c0b; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 6px; }
.tabs button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 2px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.empty { color: var(--muted); padding: 16px 0; }

@media (prefers-reduced-motion: reduce) { .bar span { animation: none !important; width: 100%; opacity: .4; } .dot { animation: none !important; } .drawer, .scrim { transition: none; } }
</style>
</head>
<body data-state="loading">
<main>
  <a class="logo" href="/">notelkz</a>

  <span class="status"><span class="dot"></span><span data-status>Checking Twitch…</span></span>
  <h1 data-title>Next stream</h1>
  <p data-text>Loading the schedule from Twitch.</p>

  <div class="count" data-count hidden>
    <div><b data-d>00</b><span>Days</span></div>
    <div><b data-h>00</b><span>Hours</span></div>
    <div><b data-m>00</b><span>Mins</span></div>
    <div><b data-s>00</b><span>Secs</span></div>
  </div>

  <div class="bar" data-bar aria-hidden="true"><span></span></div>

  <div class="row">
    <a class="btn btn-twitch" href="https://twitch.tv/elkz" rel="noopener" data-watch><svg viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg><span data-watch-label>Watch on Twitch</span></a>
    <a class="btn btn-discord" href="https://dsc.gg/notelkz" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Join the Discord</a>
  </div>

  <div class="row">
    <button class="btn btn-ghost" data-open="schedule" style="--accent:#00ff64">Schedule</button>
    <button class="btn btn-ghost" data-open="fame" style="--accent:#ffc83d">Wall of Fame</button>
    <button class="btn btn-ghost" data-open="games" style="--accent:#b58cff">Game Tracker</button>
    <button class="btn btn-ghost" data-open="setup" style="--accent:#3dd6e0">Setup</button>
  </div>

  <div class="sep"></div>
  <nav class="socials" aria-label="Socials">
    <a href="https://bsky.app/profile/notelkz.net" rel="me noopener">Bluesky</a>
    <a href="https://www.youtube.com/@notelkz" rel="me noopener">YouTube</a>
    <a href="https://www.tiktok.com/@notelkz" rel="me noopener">TikTok</a>
    <a href="https://www.instagram.com/notelkz/" rel="me noopener">Instagram</a>
    <a href="https://throne.com/elkz" rel="noopener">Throne</a>
  </nav>
  <p class="note" data-note>Times are shown in your time zone.</p>
</main>

<div class="scrim" data-close></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" hidden>
  <header><h2 id="dt" data-dt></h2><button class="x" data-close aria-label="Close">×</button></header>
  <div class="body" data-db></div>
</aside>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const el = (t, p = {}, ...k) => { const n = document.createElement(t); for (const [a, v] of Object.entries(p)) a === 'text' ? (n.textContent = v) : a === 'class' ? (n.className = v) : n.setAttribute(a, v); n.append(...k.flat(Infinity).filter((x) => x != null && x !== false)); return n; };
  const L = 'en-GB';
  const fDay = new Intl.DateTimeFormat(L, { weekday: 'long' }), fDayS = new Intl.DateTimeFormat(L, { weekday: 'short' });
  const fTime = new Intl.DateTimeFormat(L, { hour: '2-digit', minute: '2-digit' }), fDate = new Intl.DateTimeFormat(L, { day: 'numeric', month: 'long' });
  const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = (d) => Math.round((sod(d) - sod(new Date())) / 864e5);
  const when = (d) => { const n = days(d); const t = fTime.format(d); return n === 0 ? `today at ${t}` : n === 1 ? `tomorrow at ${t}` : n < 7 ? `${fDay.format(d)} at ${t}` : `${fDay.format(d)} ${fDate.format(d)} at ${t}`; };
  const pad = (n) => String(n).padStart(2, '0');

  /* ---------- data: manual override file, then the core service (/api), then demo ---------- */
  const demo = new URLSearchParams(location.search).get('demo');
  const get = (u) => fetch(u, { cache: 'no-store', signal: AbortSignal.timeout(6000) }).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
  const at = (d, h, m = 0) => { const x = new Date(); x.setDate(x.getDate() + d); x.setHours(h, m, 0, 0); return x.toISOString(); };
  const DEMO = {
    status: { live: demo === 'live', title: 'First playthrough, no spoilers', game: 'Octopath Traveler 0', viewers: 23, startedAt: new Date(Date.now() - 52 * 6e4).toISOString() },
    schedule: { vacation: demo === 'twitch-holiday' ? { start: at(-2, 0), end: at(9, 0) } : null, segments: [
      { start: at(1, 20, 30), end: at(1, 23, 30), title: 'Story night', game: 'Octopath Traveler 0' },
      { start: at(2, 20, 30), end: at(2, 23, 30), title: 'Horror Friday', game: 'Still Wakes the Deep' },
      { start: at(5, 15), end: at(5, 18), title: 'Weekend run', game: 'Octopath Traveler 0', cancelled: true },
      { start: at(8, 20, 30), end: at(8, 23, 30), title: 'Story night', game: 'Octopath Traveler 0' }] },
    override: demo === 'holiday' ? { mode: 'holiday', holiday: { until: at(12, 0).slice(0, 10), message: '' } } : { mode: 'auto' },
  };
  let status = null, schedule = null, override = { mode: 'auto' };

  async function load() {
    if (demo) { ({ status, schedule, override } = DEMO); return render(); }
    const [o, s, sc] = await Promise.allSettled([get('data/status.json'), get('/api/status'), get('/api/schedule')]);
    if (o.status === 'fulfilled') override = o.value;
    if (s.status === 'fulfilled') status = s.value;
    if (sc.status === 'fulfilled') schedule = sc.value;
    render();
  }

  /* ---------- states ---------- */
  let timer = 0;
  function render() {
    clearInterval(timer);
    const upcoming = (schedule?.segments || []).filter((x) => !x.cancelled && new Date(x.start) > new Date());
    const next = upcoming[0];
    const manualHoliday = override?.mode === 'holiday';
    const twitchHoliday = schedule?.vacation && new Date(schedule.vacation.end) > new Date();
    const live = !!status?.live;

    let state = 'unknown';
    if (manualHoliday || (twitchHoliday && !live)) state = 'holiday';
    else if (live) state = 'live';
    else if (next) state = 'next';
    else if (schedule) state = 'none';
    document.body.dataset.state = state;

    const S = $('[data-status]'), T = $('[data-title]'), P = $('[data-text]'), C = $('[data-count]'), B = $('[data-bar]'), W = $('[data-watch-label]');
    C.hidden = true; B.dataset.mode = ''; B.firstElementChild.style.width = ''; W.textContent = 'Watch on Twitch';

    if (state === 'holiday') {
      const until = manualHoliday ? (override.holiday?.until ? new Date(`${override.holiday.until}T12:00:00`) : null) : new Date(schedule.vacation.end);
      const from = manualHoliday ? null : new Date(schedule.vacation.start);
      S.textContent = 'On a break';
      T.textContent = 'Taking a break.';
      P.replaceChildren(override.holiday?.message || 'No streams for a little while. ', until ? el('span', {}, 'Back on ', el('strong', { text: `${fDay.format(until)} ${fDate.format(until)}` }), '.') : 'Back soon.');
      if (until) countdown(until);
      if (from && until) { B.dataset.mode = 'progress'; const k = Math.min(1, Math.max(0, (Date.now() - from) / (until - from))); B.firstElementChild.style.width = `${Math.round(k * 100)}%`; }
    } else if (state === 'live') {
      S.textContent = `Live now${status.viewers != null ? ` · ${status.viewers} watching` : ''}`;
      T.textContent = "We're live.";
      P.replaceChildren(el('strong', { text: status.game || 'Live on Twitch' }), status.title ? ` · ${status.title}` : '');
      W.textContent = 'Watch live now';
    } else if (state === 'next') {
      const d = new Date(next.start);
      S.textContent = `Offline · next stream ${fDayS.format(d)} ${fTime.format(d)}`;
      T.textContent = 'Next stream in';
      P.replaceChildren(el('strong', { text: next.title || 'Stream' }), next.game ? ` · ${next.game}, ` : ', ', when(d), '.');
      countdown(d);
    } else if (state === 'none') {
      S.textContent = 'Offline';
      T.textContent = 'No stream scheduled.';
      P.textContent = 'Follow on Twitch and you will get a notification the moment I go live.';
    } else {
      S.textContent = 'twitch.tv/elkz';
      T.textContent = 'Catch the next stream.';
      P.textContent = 'Follow on Twitch to get a notification when I go live.';
    }
  }
  function countdown(target) {
    const C = $('[data-count]'); C.hidden = false;
    const tick = () => { let s = Math.max(0, Math.floor((target - Date.now()) / 1000)); $('[data-d]').textContent = pad(Math.floor(s / 86400)); s %= 86400; $('[data-h]').textContent = pad(Math.floor(s / 3600)); $('[data-m]').textContent = pad(Math.floor((s % 3600) / 60)); $('[data-s]').textContent = pad(s % 60); if (target - Date.now() <= 0) { clearInterval(timer); setTimeout(load, 30000); } };
    tick(); timer = setInterval(tick, 1000);
  }

  /* ---------- drawers ---------- */
  let games = [];
  get('data/games.json').then((g) => (games = g)).catch(() => {});
  let SETUP = [], FAME = null;
  get('data/setup.json').then((d) => (SETUP = d.sections || [])).catch(() => {});
  get('data/fame.json').then((d) => (FAME = d)).catch(() => {});
  const views = {
    schedule: ['Schedule', () => { const list = schedule?.segments || []; if (document.body.dataset.state === 'holiday') return el('p', { class: 'empty', text: 'On a break, so nothing is scheduled right now.' });
      return list.length ? el('div', {}, list.map((x) => { const d = new Date(x.start); return el('div', { class: 'item' }, el('span', {}, el('b', { text: `${fDayS.format(d)} ${fTime.format(d)}` }), el('small', { text: fDate.format(d) })), el('span', {}, el('b', { text: x.title || 'Stream' }), el('small', { text: x.game || '' })), x.cancelled ? el('span', { class: 'tag', text: 'Cancelled' }) : null); })) : el('p', { class: 'empty', text: 'Nothing scheduled yet.' }); }],
    setup: ['Setup', () => el('div', {}, SETUP.map((sec) => [el('p', { class: 'h3', text: sec.title }), sec.items.map((it) => el('div', { class: 'item' }, el('span', { text: it.label }), el('span', { text: it.value })))]))],
    games: ['Game Tracker', () => { const list = el('div'), F = ['All', 'Playing', 'Coming Soon', 'Beaten'];
      const draw = (k) => list.replaceChildren(...games.filter((g) => k === 'All' || g.status === k).map((g) => el('div', { class: 'item' }, el('span', { text: g.name, style: 'color:var(--ink);font-weight:600' }), el('span', { class: `tag${g.status === 'Playing' ? ' on' : ''}`, text: g.status }))));
      const tabs = el('div', { class: 'tabs' }, F.map((k) => { const b = el('button', { 'aria-pressed': String(k === 'All'), text: k }); b.onclick = () => { $$('button', tabs).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw(k); }; return b; }));
      draw('All'); return el('div', {}, tabs, list); }],
    fame: ['Wall of Fame', () => FAME && FAME.entries?.length ? el('div', {}, FAME.intro ? el('p', { class: 'empty', text: FAME.intro }) : null, FAME.entries.map((e) => [el('p', { class: 'h3', text: e.title }), el('div', { class: 'item' }, el('span', {}, el('b', { text: e.name }), e.note ? el('small', { text: e.note }) : null), e.value ? el('span', { text: e.value }) : null)])) : el('p', { class: 'empty', text: 'Nobody on the wall yet.' })],
  };
  const dr = $('.drawer'); let opener;
  const open = (k, b) => { const [t, f] = views[k]; opener = b; dr.style.setProperty('--accent', getComputedStyle(b).getPropertyValue('--accent') || '#00ff64'); $('[data-dt]').textContent = t; $('[data-db]').replaceChildren(f()); dr.hidden = false; requestAnimationFrame(() => document.body.classList.add('open')); $('.x').focus(); };
  const close = () => { document.body.classList.remove('open'); setTimeout(() => (dr.hidden = true), 450); opener?.focus(); };
  $$('[data-open]').forEach((b) => b.addEventListener('click', () => open(b.dataset.open, b)));
  $$('[data-close]').forEach((b) => b.addEventListener('click', close));
  addEventListener('keydown', (e) => e.key === 'Escape' && document.body.classList.contains('open') && close());

  load();
  setInterval(() => { if (!document.hidden && !demo) load(); }, 60000);
})();
</script>
</body>
</html>
