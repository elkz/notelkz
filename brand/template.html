<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('../web/fonts/inter.woff') format('woff'); font-weight: 400 900; }
/* Same values as web/app.css: base colour + two radial glows. */
:root { --bg: #0b0c0b; --ink: #ecefea; --muted: #9aa39b; --line: rgba(236,239,234,.1); --green: #00ff64;
  --a: rgba(0,255,100,.2); --b: rgba(145,70,255,.2); }
[data-v='live'] { --a: rgba(0,255,100,.3); --b: rgba(145,70,255,.28); }
[data-v='holiday'] { --a: rgba(255,176,64,.2); --b: rgba(0,200,180,.14); }
html, body { margin: 0; }
body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg);
  background-image: radial-gradient(circle at 85% 10%, var(--a), transparent 55%), radial-gradient(circle at 5% 100%, var(--b), transparent 50%);
  font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--h) * .3); }
.panel b { font-weight: 850; letter-spacing: -0.04em; font-size: calc(var(--h) * .36); line-height: 1; }
.panel i { display: block; width: calc(var(--h) * .12); height: calc(var(--h) * .12); border-radius: 50%; background: var(--green); }
[data-v='holiday'] .panel i { background: #ffb040; }
.panel::after { content: ''; position: absolute; left: calc(var(--h) * .3); right: calc(var(--h) * .3); bottom: calc(var(--h) * .16); height: 1px; background: var(--line); }
</style></head>
<body><script>
  const q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--w', q.get('w') + 'px');
  document.documentElement.style.setProperty('--h', q.get('h') + 'px');
  document.documentElement.dataset.v = q.get('v') || 'default';
  if (q.get('label')) document.body.innerHTML = `<div class="panel"><b>${q.get('label')}</b><i></i></div>`;
</script></body></html>
